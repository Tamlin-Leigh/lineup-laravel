services:
    laravel.test:
        build:
            context: './vendor/laravel/sail/runtimes/8.4'
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP}'
        image: 'sail-8.4/app'
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        ports:
            - '${APP_PORT:-80}:80'
            - '${VITE_PORT:-5173}:${VITE_PORT:-5173}'
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
            # Seconds between OPcache checks for changed PHP files (see docker/php/opcache.ini).
            PHP_OPCACHE_REVALIDATE_FREQ: '${PHP_OPCACHE_REVALIDATE_FREQ:-2}'
            XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
            XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
            IGNITION_LOCAL_SITES_PATH: '${PWD}'
            # Let `artisan serve` answer several requests at once (Livewire, assets) instead of one by one.
            PHP_CLI_SERVER_WORKERS: '${PHP_CLI_SERVER_WORKERS:-4}'
        volumes:
            - '.:/var/www/html'
            - './docker/php/opcache.ini:/etc/php/8.4/cli/conf.d/99-opcache.ini:ro'
            - './docker/php/security.ini:/etc/php/8.4/cli/conf.d/99-security.ini:ro'
        networks:
            - sail
        depends_on:
            - mysql
            - redis
            - mailpit
    # Sends queued mail and notifications (booking requests and replies).
    queue:
        image: 'sail-8.4/app'
        command: ['php', 'artisan', 'queue:work', '--tries=3', '--sleep=3']
        restart: unless-stopped
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
            # Seconds between OPcache checks for changed PHP files (see docker/php/opcache.ini).
            PHP_OPCACHE_REVALIDATE_FREQ: '${PHP_OPCACHE_REVALIDATE_FREQ:-2}'
        volumes:
            - '.:/var/www/html'
            - './docker/php/opcache.ini:/etc/php/8.4/cli/conf.d/99-opcache.ini:ro'
            - './docker/php/security.ini:/etc/php/8.4/cli/conf.d/99-security.ini:ro'
        networks:
            - sail
        depends_on:
            - laravel.test
    # WebSocket server for real-time chat. Browsers connect on FORWARD_REVERB_PORT (the app already
    # has 8080 on the host); the app and queue reach it inside Docker as reverb:8080.
    reverb:
        image: 'sail-8.4/app'
        command: ['php', 'artisan', 'reverb:start', '--host=0.0.0.0', '--port=8080']
        restart: unless-stopped
        ports:
            - '${FORWARD_REVERB_PORT:-8085}:8080'
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
            # Seconds between OPcache checks for changed PHP files (see docker/php/opcache.ini).
            PHP_OPCACHE_REVALIDATE_FREQ: '${PHP_OPCACHE_REVALIDATE_FREQ:-2}'
        volumes:
            - '.:/var/www/html'
            - './docker/php/opcache.ini:/etc/php/8.4/cli/conf.d/99-opcache.ini:ro'
            - './docker/php/security.ini:/etc/php/8.4/cli/conf.d/99-security.ini:ro'
        networks:
            - sail
        depends_on:
            - laravel.test
    # Runs scheduled commands, e.g. expiring booking requests nobody answered.
    scheduler:
        image: 'sail-8.4/app'
        command: ['php', 'artisan', 'schedule:work']
        restart: unless-stopped
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
            # Seconds between OPcache checks for changed PHP files (see docker/php/opcache.ini).
            PHP_OPCACHE_REVALIDATE_FREQ: '${PHP_OPCACHE_REVALIDATE_FREQ:-2}'
        volumes:
            - '.:/var/www/html'
            - './docker/php/opcache.ini:/etc/php/8.4/cli/conf.d/99-opcache.ini:ro'
            - './docker/php/security.ini:/etc/php/8.4/cli/conf.d/99-security.ini:ro'
        networks:
            - sail
        depends_on:
            - laravel.test
    mysql:
        image: 'mysql:8.4'
        ports:
            - '${FORWARD_DB_PORT:-3306}:3306'
        environment:
            MYSQL_ROOT_PASSWORD: '${DB_PASSWORD}'
            MYSQL_ROOT_HOST: '%'
            MYSQL_DATABASE: '${DB_DATABASE}'
            MYSQL_USER: '${DB_USERNAME}'
            MYSQL_PASSWORD: '${DB_PASSWORD}'
            MYSQL_ALLOW_EMPTY_PASSWORD: 1
            MYSQL_EXTRA_OPTIONS: '${MYSQL_EXTRA_OPTIONS:-}'
        volumes:
            - 'sail-mysql:/var/lib/mysql'
            - './vendor/laravel/sail/database/mysql/create-testing-database.sh:/docker-entrypoint-initdb.d/10-create-testing-database.sh'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - mysqladmin
                - ping
                - '-p${DB_PASSWORD}'
            retries: 3
            timeout: 5s
    redis:
        image: 'redis:alpine'
        ports:
            - '${FORWARD_REDIS_PORT:-6379}:6379'
        volumes:
            - 'sail-redis:/data'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - redis-cli
                - ping
            retries: 3
            timeout: 5s
    mailpit:
        image: 'axllent/mailpit:latest'
        ports:
            - '${FORWARD_MAILPIT_PORT:-1025}:1025'
            - '${FORWARD_MAILPIT_DASHBOARD_PORT:-8025}:8025'
        networks:
            - sail
    phpmyadmin:
        image: 'phpmyadmin:5.2'
        # Logs straight in as the Sail database user, so only listen on this machine.
        ports:
            - '127.0.0.1:${FORWARD_PHPMYADMIN_PORT:-8081}:80'
        environment:
            PMA_HOST: mysql
            PMA_PORT: 3306
            PMA_USER: '${DB_USERNAME}'
            PMA_PASSWORD: '${DB_PASSWORD}'
            UPLOAD_LIMIT: 64M
        networks:
            - sail
        depends_on:
            - mysql
networks:
    sail:
        driver: bridge
volumes:
    sail-mysql:
        driver: local
    sail-redis:
        driver: local
