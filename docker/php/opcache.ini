; Local development only. Sail serves the app with `php artisan serve` (the CLI server), where
; OPcache is off by default.
;
; How often (seconds) OPcache re-checks PHP files for changes comes from PHP_OPCACHE_REVALIDATE_FREQ
; (compose.yaml; 2 if unset). With the project on the Windows drive, checking every file is slow, so
; it re-checks at most every 2 seconds; the first request after a pause still pays ~1.5s for it. With
; the project inside WSL (see README), set PHP_OPCACHE_REVALIDATE_FREQ=0 in .env: checks are cheap
; there, and code edits show up on the very next request.
opcache.enable_cli=1
opcache.memory_consumption=256
opcache.max_accelerated_files=30000
opcache.validate_timestamps=1
opcache.revalidate_freq=${PHP_OPCACHE_REVALIDATE_FREQ:-2}
; Sail loads Xdebug, which can't run alongside the JIT; turn the JIT off rather than warn on every command.
opcache.jit=disable
