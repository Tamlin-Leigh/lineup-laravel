; Local development only. Sail serves the app with `php artisan serve` (the CLI server), where
; OPcache is off by default. On the Windows bind mount, checking every file for changes on every
; request is also slow (~1.5s a page), so re-check each file at most every 2 seconds: pages take
; ~0.3s and code edits still show up within 2 seconds.
opcache.enable_cli=1
opcache.memory_consumption=256
opcache.max_accelerated_files=30000
opcache.validate_timestamps=1
opcache.revalidate_freq=2
; Sail loads Xdebug, which can't run alongside the JIT; turn the JIT off rather than warn on every command.
opcache.jit=disable
