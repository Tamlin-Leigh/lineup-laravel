; Hardening from the October 2026 PHP security advisory (CVE-2026-109618 / CVE-2026-109619).
; Laravel keeps its own sessions and never uses PHP's native upload-progress tracking, so turning
; it off costs nothing and closes the advisory's attack path if the PHP runtime ever lags a patch.
; This is a backstop, not the fix: the fix is PHP 8.4.27+ (rebuild the Sail image, see README).
session.upload_progress.enabled=0
